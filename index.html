<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4A90E2">
  <meta name="description" content="Jogo Educativo Inclusivo e Acessível em PWA">
  <title>Jogo Educativo PWA</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
</head>
<body>
  <header>
    <h1>Jogo Educativo</h1>
    <button id="btn-install" hidden>Instalar App</button>
  </header>

  <main id="app-container">
    <section id="score-board">
      <p>Pontuação: <span id="score">0</span></p>
    </section>

    <section id="game-area">
      <div id="card-display">
        <img id="game-image" src="assets/img/jogo/exemplo.png" alt="Imagem da pergunta atual">
      </div>

      <div id="libras-container">
        <video id="libras-video" controls muted poster="assets/libras/poster.png">
          <source src="assets/libras/exemplo.mp4" type="video/mp4">
          Seu navegador não suporta vídeos em Libras.
        </video>
      </div>

      <div id="options-container">
        <button class="option-btn" data-correct="true">Opção 1</button>
        <button class="option-btn" data-correct="false">Opção 2</button>
      </div>
    </section>

    <audio id="feedback-audio" src="assets/audio/acerto.mp3" preload="auto"></audio>
  </main>

  <script src="app.js"></script>
</body>
</html>
